name: Security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 7 * * 1'
permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-pinned gitleaks
        run: bash scripts/install-gitleaks.sh
      - name: Scan full history and working tree
        run: |
          work/bin/gitleaks git --redact --no-banner
          work/bin/gitleaks dir . --redact --no-banner
  audit-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=low
      - run: npm run check
      - run: npm run audit:contrast
      - run: npm test
      - run: npm run test:female
      - run: npm run test:board
      - run: npm run test:security
      - run: npm run test:click
      - run: npm run test:find-no-clues
      - run: npm run test:identify
      - run: npm run quiz:check
      - run: npm run test:quiz-setup
      - run: npm run test:quiz-session
      - run: npm run test:quiz-modes
      - run: npm run test:rls
      - run: npm run build
      - run: npm run test:public-pages
      - run: npm run audit:bundle
      - run: npm run check:client
      - run: npm run build:functions
      - run: npm run test:pages-config
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
  local-regressions:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.20.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run quiz:check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:quiz-browser
      - run: npm run build:functions
      - run: npm run test:pages
